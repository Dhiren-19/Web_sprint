<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Sign in to Spider-Verse Academy — your gamified educational platform across dimensions. Track courses, streaks, and projects.">
    <title>Spider-Verse Academy | Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@300;400;500;600;700&family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="login-container" id="login-container">

        <!-- ========== LEFT COLUMN — Visual Showcase ========== -->
        <div class="login-left">
            <!-- Floating particles -->
            <div class="particles" id="particles"></div>

            <!-- Multiverse portal -->
            <div class="portal-wrapper">
                <div class="portal">
                    <div class="portal-ring portal-ring--1"></div>
                    <div class="portal-ring portal-ring--2"></div>
                    <div class="portal-ring portal-ring--3"></div>
                    <div class="portal-core"></div>
                    <div class="portal-flare"></div>
                </div>
            </div>

            <!-- Web lines radiating -->
            <div class="web-strands">
                <svg viewBox="0 0 600 900" fill="none" xmlns="http://www.w3.org/2000/svg" class="web-svg">
                    <line x1="300" y1="200" x2="0" y2="0" stroke="rgba(0,229,255,0.06)" stroke-width="1" />
                    <line x1="300" y1="200" x2="600" y2="0" stroke="rgba(255,23,68,0.06)" stroke-width="1" />
                    <line x1="300" y1="200" x2="0" y2="450" stroke="rgba(255,234,0,0.04)" stroke-width="1" />
                    <line x1="300" y1="200" x2="600" y2="450" stroke="rgba(213,0,249,0.04)" stroke-width="1" />
                    <line x1="300" y1="200" x2="150" y2="900" stroke="rgba(0,229,255,0.03)" stroke-width="1" />
                    <line x1="300" y1="200" x2="450" y2="900" stroke="rgba(255,23,68,0.03)" stroke-width="1" />
                </svg>
            </div>

            <!-- Hero image (Miles Morales) -->
            <div class="hero-image-wrapper">
                <img src="C:\Users\dhire\OneDrive\Desktop\Web_sprint\Untitled design.jpg" alt="Spider-Verse Hero"
                    class="hero-image" id="hero-image">
                <div class="hero-glow"></div>
            </div>

            <!-- Brand text at bottom -->
            <div class="left-brand">
                <div class="brand-logo">
                    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="20" cy="20" r="18" stroke="#ff1744" stroke-width="2.5" />
                        <path d="M20 6 L20 34 M6 20 L34 20 M10 10 L30 30 M30 10 L10 30" stroke="#00e5ff"
                            stroke-width="1.2" opacity="0.7" />
                        <circle cx="20" cy="20" r="6" fill="#ff1744" />
                    </svg>
                </div>
                <span class="brand-text">VERSE<span class="brand-accent">EDU</span></span>
            </div>
        </div>

        <!-- ========== RIGHT COLUMN — Login Form ========== -->
        <div class="login-right">
            <!-- Halftone overlay -->
            <div class="halftone-bg"></div>

            <!-- Floating accent shapes -->
            <div class="accent-shape accent-shape--1"></div>
            <div class="accent-shape accent-shape--2"></div>

            <div class="login-card" id="login-card">
                <!-- Sign In Form -->
                <div class="form-view form-view--signin active" id="view-signin">
                    <div class="card-header">
                        <h1 class="card-title" id="login-title">Welcome Back</h1>
                        <p class="card-subtitle">Enter the multiverse and continue your journey.</p>
                    </div>

                    <form class="login-form" id="signin-form" autocomplete="off">
                        <div class="input-group" id="input-email">
                            <label class="input-label" for="email">Username or Email</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                    <circle cx="12" cy="7" r="4" />
                                </svg>
                                <input type="text" class="form-input" id="email" placeholder="miles@spiderverse.edu"
                                    required>
                                <div class="input-glow"></div>
                            </div>
                        </div>

                        <div class="input-group" id="input-password">
                            <label class="input-label" for="password">Password</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                </svg>
                                <input type="password" class="form-input" id="password" placeholder="••••••••" required>
                                <button type="button" class="toggle-password" id="toggle-password"
                                    aria-label="Toggle password visibility">
                                    <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                        <circle cx="12" cy="12" r="3" />
                                    </svg>
                                    <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" style="display:none">
                                        <path
                                            d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                        <line x1="1" y1="1" x2="23" y2="23" />
                                    </svg>
                                </button>
                                <div class="input-glow"></div>
                            </div>
                        </div>

                        <div class="form-options">
                            <label class="remember-me">
                                <input type="checkbox" id="remember" checked>
                                <span class="checkmark"></span>
                                <span>Remember me</span>
                            </label>
                            <a href="#" class="forgot-link" id="forgot-link">Forgot Password?</a>
                        </div>

                        <button type="submit" class="btn-signin" id="btn-signin">
                            <span class="btn-text">Sign In</span>
                            <div class="btn-loader" id="btn-loader"></div>
                            <div class="btn-glitch-layer"></div>
                        </button>
                    </form>

                    <div class="divider">
                        <span>or continue with</span>
                    </div>

                    <div class="social-buttons">
                        <button class="btn-social" id="btn-google" aria-label="Sign in with Google">
                            <svg viewBox="0 0 24 24" width="20" height="20">
                                <path
                                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
                                    fill="#4285F4" />
                                <path
                                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                    fill="#34A853" />
                                <path
                                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                                    fill="#FBBC05" />
                                <path
                                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                    fill="#EA4335" />
                            </svg>
                        </button>
                        <button class="btn-social" id="btn-github" aria-label="Sign in with GitHub">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                <path
                                    d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" />
                            </svg>
                        </button>
                        <button class="btn-social" id="btn-discord" aria-label="Sign in with Discord">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                <path
                                    d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189z" />
                            </svg>
                        </button>
                    </div>

                    <p class="switch-text">
                        Don't have an account? <a href="#" class="switch-link" id="to-signup">Create Account</a>
                    </p>
                </div>

                <!-- Sign Up Form -->
                <div class="form-view form-view--signup" id="view-signup">
                    <div class="card-header">
                        <h1 class="card-title">Join The Verse</h1>
                        <p class="card-subtitle">Create your identity across dimensions.</p>
                    </div>

                    <form class="login-form" id="signup-form" autocomplete="off">
                        <div class="input-group">
                            <label class="input-label" for="signup-name">Full Name</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                    <circle cx="12" cy="7" r="4" />
                                </svg>
                                <input type="text" class="form-input" id="signup-name" placeholder="Miles Morales"
                                    required>
                                <div class="input-glow"></div>
                            </div>
                        </div>
                        <div class="input-group">
                            <label class="input-label" for="signup-email">Email</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path
                                        d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                                    <polyline points="22,6 12,13 2,6" />
                                </svg>
                                <input type="email" class="form-input" id="signup-email"
                                    placeholder="miles@spiderverse.edu" required>
                                <div class="input-glow"></div>
                            </div>
                        </div>
                        <div class="input-group">
                            <label class="input-label" for="signup-password">Password</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                </svg>
                                <input type="password" class="form-input" id="signup-password" placeholder="••••••••"
                                    required>
                                <div class="input-glow"></div>
                            </div>
                        </div>

                        <button type="submit" class="btn-signin">
                            <span class="btn-text">Create Account</span>
                            <div class="btn-glitch-layer"></div>
                        </button>
                    </form>

                    <p class="switch-text">
                        Already have an account? <a href="#" class="switch-link" id="to-signin">Sign In</a>
                    </p>
                </div>
            </div>

            <!-- Bottom decorative text -->
            <div class="right-footer">
                <p>© 2026 Spider-Verse Academy. All dimensions reserved.</p>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>

</html>
